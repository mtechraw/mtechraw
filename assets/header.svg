<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="55%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#101826"/>
    </linearGradient>
  </defs>

  <!-- outer card -->
  <rect x="1.5" y="1.5" width="897" height="297" rx="14" fill="url(#bg)" stroke="url(#glow)" stroke-width="1.5"/>

  <!-- faint grid -->
  <g stroke="#1c2942" stroke-width="1" opacity="0.35">
    <path d="M0 60H900M0 120H900M0 180H900M0 240H900"/>
    <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300"/>
  </g>

  <!-- terminal title bar -->
  <rect x="1.5" y="1.5" width="897" height="38" rx="14" fill="#131c2e"/>
  <rect x="1.5" y="24" width="897" height="16" fill="#131c2e"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="21" r="6" fill="#27c93f"/>
  <text x="450" y="26" text-anchor="middle" font-size="13" fill="#5b6b8c">mukesh@dev: ~/ai-lab</text>

  <!-- whoami -->
  <text x="34" y="82" font-size="16">
    <tspan fill="#27c93f">$</tspan>
    <tspan fill="#8b9bb8" dx="8">whoami</tspan>
  </text>
  <text x="34" y="126" font-size="34" font-weight="700" fill="url(#glow)" letter-spacing="1">MUKESH RAWAT</text>
  <text x="34" y="152" font-size="15" fill="#8b9bb8">AI Engineer · Full-Stack Developer · Web Performance · MarTech</text>

  <!-- rotating "currently running" line -->
  <text x="34" y="200" font-size="16">
    <tspan fill="#27c93f">$</tspan>
    <tspan fill="#8b9bb8" dx="8">now --running</tspan>
  </text>
  <g font-size="17" fill="#00e5ff">
    <text x="34" y="230" opacity="0">
      &#9656; deploying voice AI agents that close real calls
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.22;0.25" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="230" opacity="0">
      &#9656; shipping LLM vision pipelines (OCR &#8594; structured data)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.29;0.47;0.50" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="230" opacity="0">
      &#9656; hunting milliseconds in Core Web Vitals audits
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.50;0.54;0.72;0.75" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="230" opacity="0">
      &#9656; wiring server-side tracking &amp; consent done right
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.97;1" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="34" y="248" width="11" height="20" fill="#27c93f">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- animated neural network, right side -->
  <g>
    <!-- edges with flowing dashes -->
    <g stroke="#7c4dff" stroke-width="1.2" opacity="0.7" stroke-dasharray="4 6">
      <line x1="650" y1="90" x2="740" y2="70">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2.4s" repeatCount="indefinite"/>
      </line>
      <line x1="650" y1="90" x2="740" y2="130">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="3.1s" repeatCount="indefinite"/>
      </line>
      <line x1="650" y1="170" x2="740" y2="130">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2.8s" repeatCount="indefinite"/>
      </line>
      <line x1="650" y1="170" x2="740" y2="190">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2.2s" repeatCount="indefinite"/>
      </line>
      <line x1="740" y1="70" x2="830" y2="110">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2.6s" repeatCount="indefinite"/>
      </line>
      <line x1="740" y1="130" x2="830" y2="110">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="3.4s" repeatCount="indefinite"/>
      </line>
      <line x1="740" y1="190" x2="830" y2="150">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2.0s" repeatCount="indefinite"/>
      </line>
      <line x1="740" y1="130" x2="830" y2="150">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="2.9s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- input nodes -->
    <g fill="#00e5ff">
      <circle cx="650" cy="90" r="6">
        <animate attributeName="r" values="6;8;6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="650" cy="170" r="6">
        <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- hidden nodes -->
    <g fill="#7c4dff">
      <circle cx="740" cy="70" r="6">
        <animate attributeName="r" values="6;8;6" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="740" cy="130" r="6">
        <animate attributeName="r" values="6;8;6" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="740" cy="190" r="6">
        <animate attributeName="r" values="6;8;6" dur="3.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- output nodes -->
    <g fill="#ff9100">
      <circle cx="830" cy="110" r="7">
        <animate attributeName="r" values="7;9;7" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="830" cy="150" r="7">
        <animate attributeName="r" values="7;9;7" dur="2.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="740" y="225" text-anchor="middle" font-size="12" fill="#5b6b8c">inference: <tspan fill="#27c93f">live</tspan></text>
  </g>
</svg>
