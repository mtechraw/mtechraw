<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="55%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#101826"/>
    </linearGradient>
  </defs>

  <!-- outer card -->
  <rect x="1.5" y="1.5" width="897" height="297" rx="14" fill="url(#bg)" stroke="url(#glow)" stroke-width="1.5"/>

  <!-- faint grid -->
  <g stroke="#1c2942" stroke-width="1" opacity="0.35">
    <path d="M0 60H900M0 120H900M0 180H900M0 240H900"/>
    <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300"/>
  </g>

  <!-- terminal title bar -->
  <rect x="1.5" y="1.5" width="897" height="38" rx="14" fill="#131c2e"/>
  <rect x="1.5" y="24" width="897" height="16" fill="#131c2e"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="21" r="6" fill="#27c93f"/>
  <text x="450" y="26" text-anchor="middle" font-size="13" fill="#5b6b8c">mukesh@dev: ~/work</text>

  <!-- whoami -->
  <text x="34" y="82" font-size="16">
    <tspan fill="#27c93f">$</tspan>
    <tspan fill="#8b9bb8" dx="8">whoami</tspan>
  </text>
  <text x="34" y="126" font-size="34" font-weight="700" fill="url(#glow)" letter-spacing="1">MUKESH RAWAT</text>
  <text x="34" y="152" font-size="15" fill="#8b9bb8">Full-Stack Developer · Voice AI · Web Performance · MarTech</text>

  <!-- rotating "currently running" line -->
  <text x="34" y="200" font-size="16">
    <tspan fill="#27c93f">$</tspan>
    <tspan fill="#8b9bb8" dx="8">now --running</tspan>
  </text>
  <g font-size="17" fill="#00e5ff">
    <text x="34" y="230" opacity="0">
      ▸ building voice AI agents that actually close calls
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.30;0.33" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="230" opacity="0">
      ▸ hunting milliseconds in Core Web Vitals audits
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.38;0.63;0.66" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="230" opacity="0">
      ▸ wiring server-side tracking &amp; consent done right
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="34" y="248" width="11" height="20" fill="#27c93f">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- right-side status block -->
  <g font-size="13" fill="#5b6b8c">
    <text x="640" y="86">┌─ status ────────────┐</text>
    <text x="640" y="112">│ mode: <tspan fill="#27c93f">shipping</tspan></text>
    <text x="640" y="138">│ stack: <tspan fill="#ff9100">PHP·JS·Py</tspan></text>
    <text x="640" y="164">│ uptime: <tspan fill="#00e5ff">10+ yrs</tspan></text>
    <text x="640" y="190">└─────────────────────┘</text>
  </g>
</svg>
